<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <!-- Link para o reset.css -->
  <link rel="stylesheet" href="assets/css/reset.css">
  <!-- Link para o style.css -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <div class="register-display">

    <div class="register-content">
      <h1>CRIANDO UMA CONTA</h1>
      <form id="register-form">
        <div class="name-register">
          <label for="input-name-register">Nome:</label>
          <input id="input-name-register" type="text" name="name" placeholder="Digite o seu nome" required>
        </div>

        <div class="email-register">
          <label for="input-email-register">E-mail:</label>
          <input id="input-email-register" type="email" name="email" placeholder="Digite o seu e-mail" required>
        </div>

        <div class="date-register">
          <label for="input-date-register">Data de Nascimento:</label>
          <input id="input-date-register" type="date" name="data_nascimento" required>
        </div>

        <div class="cep-register">
          <label for="input-cep-register">CEP:</label>
          <input id="input-cep-register" type="text" name="cep" placeholder="XXXXX-XXX" required pattern="\d{5}-\d{3}">
        </div>

        <div class="genero-register">
          <label for="input-genero-register">Gênero:</label>
          <select id="input-genero-register" name="genero" required>
            <option value="" disabled selected>Selecione o gênero</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="password-register">
          <label for="input-password-register">Senha:</label>
          <input id="input-password-register" type="password" name="senha" placeholder="Digite a sua senha" required>
        </div>

        <button type="submit" id="register-button-sql">Cadastrar</button>
      </form>

      <div id="confirmacao-cadastro" class="mensagem-confirmacao"></div>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>

</html>
