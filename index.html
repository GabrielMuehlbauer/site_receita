<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicial</title>
    <!-- Link para o reset.css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <!-- Link para o style.css -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <div class="header-content">
            <a href="" id="menu-button"></a>
            <img src="" alt="Logo do Site">

            <!-- Barra de Pesquisa para Receitas -->
            <label for="barra-pesquisa">Pesquisar:</label>
            <input type="search" id="barra-pesquisa" name="q" placeholder="Digite sua busca...">
            <button type="submit">Buscar</button>
        </div>
    </header>

    <main>
        <div class="main-content">
            <div class="carousel">
                <div class="carousel-track">

                    <!-- Slide 1 -->
                    <div class="carousel-item">
                        <img src="" alt="slide carrossel 1">
                    </div>

                    <!-- Slide 2 -->
                    <div class="carousel-item">
                        <img src="" alt="slide carrossel 2">
                    </div>

                </div>

                <button class="carousel-button prev">‹</button>
                <button class="carousel-button next">›</button>
            </div>
            <section class="categorias-receita">
                <div>
                    <h2>Categorias de Receita</h2>
                    <div class="grid-categorias">
                        <div class="categoria-card">
                            <img src="" alt="categoria1">
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>



    <!-- Link para o script.js -->
    <script src="js/script.js"></script>
</body>

</html>
