<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Administrador</title>
    <!-- Link para o reset.css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <!-- Link para o style.css -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <div class="header-content">
            <div class="menu-logo">
                <a class="menu-button">
                    <img src="assets/icons/menu_40dp_7A472C_FILL0_wght400_GRAD0_opsz40.svg" alt="">
                </a>
                <h1>QUASE TUDO GOSTOSO</h1>
            </div>

            <div class="search-container">
                <!-- Barra de Pesquisa para Receitas -->
                <input type="search" class="barra-pesquisa" name="q" placeholder="Digite sua busca...">
                <button type="submit">Buscar</button>
            </div>
        </div>
    </header>

    <!-- Menu Lateral -->
    <nav class="side-menu">
        <div class="side-menu-content">
            <h4>QUASE TUDO GOSTOSO</h4>
            <a href="index.html">Início</a>
            <a href="admin.html">Página do Administrador</a>
        </div>
    </nav>

    <main>
        <div class="admin-content">
            <div class="sub-header-admin">
                <h1>PÁGINA DO ADMINISTRADOR</h1>
                <p>Bem vindo a página do administrador, aqui você poderá cadastrar uma refeição ou uma categoria de
                    receita.
                </p>
            </div>

            <section class="categoria-receita">
                <div class="categoria-receita-content">
                    <h2>Cadastrar Categoria de Receita</h2>
                    <form id="admin-categoria-form">
                        <label for="categoria-nome">Nome da Categoria:</label>
                        <input type="text" id="categoria-nome" name="categoria-nome" required>

                        <button type="submit">Cadastrar Categoria</button>
                    </form>

                    <div id="confirmacao-categoria" class="mensagem-confirmacao"></div>
                </div>
            </section>

            <section class="refeicao">
                <div class="refeicao-content">
                    <h2>Cadastrar Refeição</h2>
                    <form id="admin-refeicao-form">
                        <label for="refeicao-nome">Nome da Refeição:</label>
                        <input type="text" id="refeicao-nome" name="refeicao-nome" required>

                        <button type="submit">Cadastrar Refeição</button>
                    </form>

                    <div id="confirmacao-refeicao" class="mensagem-confirmacao"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="assets/js/script.js"></script>
</body>

</html>
