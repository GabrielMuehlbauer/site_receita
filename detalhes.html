<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Link para o reset.css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <!-- Link para o style.css -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <div class="header-content">
            <div class="menu-logo">
                <a class="menu-button">
                    <img src="assets/icons/menu_40dp_7A472C_FILL0_wght400_GRAD0_opsz40.svg" alt="">
                </a>
                <h1>QUASE TUDO GOSTOSO</h1>
            </div>

            <div class="search-container">
                <!-- Barra de Pesquisa para Receitas -->
                <input type="search" class="barra-pesquisa" name="q" placeholder="Digite sua busca...">
                <button type="submit">Buscar</button>
            </div>
        </div>
    </header>

    <!-- Menu Lateral -->
    <nav class="side-menu">
        <div class="side-menu-content">
            <h4>QUASE TUDO GOSTOSO</h4>
            <a href="index.html">Início</a>
            <a href="admin.html">Página do Administrador</a>
            <a href="receitas.html">Receita</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <main>
        <div class="main-content">
            <div class="receita">
                <div class="receita-content">
                    <img id="detalhe-imagem" src="" alt="">
                    <h1 id="detalhe-titulo"></h1>
                    <h3 id="detalhe-descricao"></h3>

                    <div class="detalhes-receita">
                        <p><b>Categoria:</b> <span id="detalhe-categoria"></span></p>
                        <p><b>Dificuldade:</b> <span id="detalhe-dificuldade"></span></p>
                        <p><b>Tempo de Preparo:</b> <span id="detalhe-tempo"></span></p>
                    </div>

                    <div class="ingredientes-receita">
                        <h2>Ingredientes</h2>
                        <ul id="detalhe-lista-ingredientes">
                        </ul>
                    </div>

                    <div class="modo-preparo-receita">
                        <h2>Modo de Preparo</h2>
                        <div id="detalhe-modo-preparo">
                        </div>
                    </div>

                    <div class="informacoes-adicionais-receita">
                        <div class="utensilios">
                            <p><b>Utensílios:</b></p>
                            <h3 id="detalhe-utensilios"></h3>
                        </div>
                        <div class="custo-cozinha">
                            <div class="custo">
                                <p><b>Custo:</b></p>
                                <h3 id="detalhe-custo"></h3>
                            </div>
                            <div class="cozinha">
                                <p><b>Cozinha:</b></p>
                                <h3 id="detalhe-cozinha"></h3>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/script.js"></script>
</body>

</html>
